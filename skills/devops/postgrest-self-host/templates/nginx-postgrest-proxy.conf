# Nginx location block to proxy supabase-js requests to PostgREST
#
# The supabase-js client sends requests to: {url}/rest/v1/{table}
# PostgREST expects:                       /{table}
#
# This block:
# 1. Strips the /rest/v1/ prefix
# 2. Strips the Authorization header (PostgREST rejects invalid JWT from supabase-js)
# 3. Proxies to local PostgREST

location /rest/v1/ {
    proxy_pass http://127.0.0.1:3334/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CRITICAL: Strip the Authorization header.
    # supabase-js sends "Authorization: Bearer <anon-key>" which is NOT a valid JWT.
    # PostgREST tries JWT verification and returns PGRST301.
    # Stripping the header makes PostgREST use the anon role (anonymous access).
    proxy_set_header Authorization "";
}

